name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Default package list includes obsolete `tools`, which sdkmanager no longer ships.
          packages: platform-tools

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Assemble debug and run unit tests
        run: ./gradlew assembleDebug testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble minified release (checks consumer R8 rules)
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify @NetSubscribe methods survived R8
        run: |
          mapping=app/build/outputs/mapping/release/mapping.txt
          for m in onWifiConnected onMobileConnected onDisconnected netChange; do
            grep -Eq "void $m\((com\.sunchen\.netbus\.type\.NetType)?\)(:[0-9]+)* -> $m$" "$mapping" \
              || { echo "::error::$m was renamed or removed by R8"; exit 1; }
          done
