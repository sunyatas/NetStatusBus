plugins {
    id 'com.android.library'
    id 'maven-publish'
    id 'me.champeau.gradle.japicmp' version '0.4.6'
}

android {
    namespace 'com.sunchen.netbus'
    compileSdk 35

    defaultConfig {
        minSdk 21
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        // CI runs :netbuslib:lintDebug; any new warning fails the build
        warningsAsErrors true
        abortOnError true
        // Dependency versions are kept low on purpose so the host app's newer versions win
        disable 'GradleDependency'
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
            withJavadocJar()
        }
    }
}

dependencies {
    implementation 'androidx.annotation:annotation:1.9.1'
    // LifecycleOwner 出现在公开 API 中；版本取较低值，宿主里更高的版本会自动胜出
    api 'androidx.lifecycle:lifecycle-common:2.6.2'
    // getNetTypeLiveData() 返回 LiveData（纯 Java，不引入 Kotlin 标准库）
    api 'androidx.lifecycle:lifecycle-livedata-core:2.6.2'
    testImplementation 'junit:junit:4.13.2'
    // Android stubs throw Stub! from ContextWrapper/Activity constructors; mocks avoid calling them
    testImplementation 'org.mockito:mockito-core:5.14.2'
    // InstantTaskExecutorRule: lets LiveData.setValue run on the JVM, which has no main looper
    testImplementation 'androidx.arch.core:core-testing:2.2.0'
}

// Library version. JitPack passes -Pversion=<tag or commit>, which takes precedence.
def libraryVersion = '1.2.0'

// JitPack (https://jitpack.io) builds this publication via publishToMavenLocal
afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'com.github.sunyatas'
                artifactId = 'netstatusbus'
                version = (project.version == 'unspecified') ? libraryVersion : project.version.toString()
            }
        }
    }
}

// Strict check of the public API Javadoc with the JDK doclint (the published -javadoc.jar is
// rendered by AGP's Dokka-based javaDocReleaseGeneration, which does not report doc errors).
// CI runs `:netbuslib:javadocLint`; any doclint warning fails the build.
android.libraryVariants.configureEach { variant ->
    if (variant.name != 'release') return
    def javaCompile = variant.javaCompileProvider
    tasks.register('javadocLint', Javadoc) {
        group = 'verification'
        description = 'Runs javadoc with -Xdoclint:all -Werror on the public API (output is discarded).'
        dependsOn javaCompile
        source = android.sourceSets.main.java.srcDirs
        include '**/*.java'
        classpath = files(android.bootClasspath) + files(javaCompile.map { it.classpath })
        destinationDir = layout.buildDirectory.dir('tmp/javadocLint').get().asFile
        options.memberLevel = JavadocMemberLevel.PUBLIC
        options.encoding = 'UTF-8'
        options.addStringOption('Xdoclint:all', '-quiet')
        options.addBooleanOption('Werror', true)
    }
}

// Binary compatibility check against the last release on JitPack. CI runs `:netbuslib:japicmp`;
// removing or changing anything public that 1.2.0 callers could link against fails the build.
// Additions are allowed. Bump apiBaselineVersion after each release.
def apiBaselineVersion = '1.2.0'
def apiBaseline = configurations.detachedConfiguration(
        dependencies.create("com.github.sunyatas:NetStatusBus:${apiBaselineVersion}@aar"))
apiBaseline.transitive = false

def extractApiBaseline = tasks.register('extractApiBaseline', Copy) {
    from({ zipTree(apiBaseline.singleFile) }) { include 'classes.jar' }
    into layout.buildDirectory.dir("tmp/apiBaseline/${apiBaselineVersion}")
}

android.libraryVariants.configureEach { variant ->
    if (variant.name != 'release') return
    def javaCompile = variant.javaCompileProvider
    def currentJar = tasks.register('apiCurrentJar', Jar) {
        from(javaCompile.flatMap { it.destinationDirectory })
        exclude '**/BuildConfig.class', '**/R.class', '**/R$*.class'
        archiveFileName = 'current-api.jar'
        destinationDirectory = layout.buildDirectory.dir('tmp/apiCurrent')
    }
    tasks.register('japicmp', me.champeau.gradle.japicmp.JapicmpTask) {
        group = 'verification'
        description = "Fails if the public API is not binary compatible with ${apiBaselineVersion}."
        dependsOn extractApiBaseline
        oldClasspath.from(extractApiBaseline.map { new File(it.destinationDir, 'classes.jar') })
        newClasspath.from(currentJar)
        onlyBinaryIncompatibleModified = true
        failOnModification = true
        ignoreMissingClasses = true
        txtOutputFile = layout.buildDirectory.file('reports/japicmp.txt')
    }
}

